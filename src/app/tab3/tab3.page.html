<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tambah Mata Kuliah
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-input label="Mata Kuliah" placeholder="Isikan nama mata kuliah"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Jam" placeholder="Isikan jam"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Lokasi" placeholder="Isikan lokasi"></ion-input>
        </ion-item>
        <br>
      <ion-button>Simpan</ion-button>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
